# テスト用本番デプロイワークフロー (Frontend - Main)
# 本番の shk_prod_deploy.yml を擬似再現
# 20分の待機後に完了する
name: "[shk][prod] Deploy (Test)"

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Deploy info
        run: |
          echo "=== [shk][prod] Deploy (Test) - Frontend ==="
          echo "Ref: ${{ github.ref }}"
          echo "SHA: ${{ github.sha }}"
          echo "Started at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

      - name: Simulate deploy (20 min)
        run: |
          echo "Simulating frontend deploy for 1200 seconds..."
          sleep 1200
          echo "Deploy simulation complete at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
